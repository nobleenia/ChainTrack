name: ChainTrack CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ================================
  # Backend Tests
  # ================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: chaintrack_test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: chaintrack_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run linting
        working-directory: ./backend
        run: |
          pip install flake8
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        working-directory: ./backend
        env:
          FLASK_ENV: testing
          DATABASE_URL: postgresql://chaintrack_test:testpassword@localhost:5432/chaintrack_test
          SECRET_KEY: test-secret-key
          JWT_SECRET_KEY: test-jwt-secret
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  # ================================
  # Frontend Tests
  # ================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linting
        working-directory: ./frontend
        run: npm run lint

      - name: Run type check
        working-directory: ./frontend
        run: npm run type-check || true  # Optional for now

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --coverage --watchAll=false || true  # Tests to be added

      - name: Build
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:5000/api
        run: npm run build

  # ================================
  # Smart Contract Tests
  # ================================
  contracts-test:
    name: Smart Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        working-directory: ./contracts
        run: npm ci

      - name: Compile contracts
        working-directory: ./contracts
        run: npm run compile

      - name: Run tests
        working-directory: ./contracts
        run: npm test

      - name: Check contract size
        working-directory: ./contracts
        run: npx hardhat size-contracts || true

  # ================================
  # Security Audit
  # ================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [contracts-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither analysis
        working-directory: ./contracts
        continue-on-error: true  # Don't fail build on audit warnings
        run: |
          npm ci
          slither . --exclude naming-convention,external-function || true

  # ================================
  # Build Docker Images
  # ================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: chaintrack-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.dev
          push: false
          tags: chaintrack-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================
  # Deploy Preview
  # ================================
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, contracts-test]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Preview
        run: echo "🚀 Preview deployment would happen here (Vercel/Railway integration)"

  # ================================
  # Deploy Production
  # ================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, contracts-test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: echo "🚀 Production deployment would happen here"
